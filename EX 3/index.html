<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Sono", sans-serif;
      }
      .pricing-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        margin-top: 50px;
        flex-direction: row;
        padding: 20px;
        border-radius: 10px;
        justify-content: space-around;
        background: linear-gradient(green, blue, purple)
      }
      .pricing-plan {
        background-color: #40e5f4;
        padding: 20px;
        border-radius: 10px;
        width: 300px;
        text-align: center;
        display: flex;
        flex-direction: column;
        height: 300px;
        
      }
      .plan-title {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 10px;
        text-align: center;
        border-radius: 10px;
        margin-bottom: auto;
        background: linear-gradient( 45deg ,blue, rgb(9, 165, 217), rgb(116, 239, 14));
      }
      .plan-price {
        font-size: 20px;
        margin-bottom: 10px;
        text-align: center;
      }
      .plan-features{
        margin-bottom: 5px;
      }
      .plan-button {
        display: block;
        width: 100%;
        padding: 10px;
        background-color: rgb(41, 41, 191);
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 20px;
        margin-top: auto;
      }
      .plan-button:hover {
        background-color: rgb(87, 87, 207);
      }
      /* Hint: What can you do with a media query and flexbox? */
      @media (max-width: 1250px) {
        .pricing-container {
          flex-direction: column;
          align-items: center;
        }
        .pricing-container{
          margin: 28%;
        }
      }
    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan">
        <div class="plan-title">Basic</div>
        <div class="plan-price">$9.99/month</div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Standard</div>
        <div class="plan-price">$19.99/month</div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Premium</div>
        <div class="plan-price">$49.99/month</div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
