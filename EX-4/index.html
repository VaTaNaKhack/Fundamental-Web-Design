<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
    <script src="https://kit.fontawesome.com/238670ec72.js" crossorigin="anonymous"></script>

</head>
<body>
    <div class="container">
        <menu class="left-section">
            <div class="menu-logo">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>MENU</span>
            </div>
            
            <ul class="list">
                <li class="item current">
                    <i class="fa-solid fa-display"></i> Dashboard
                </li>
                <li class="item">
                    <i class="fa-solid fa-folder"></i> Class
                </li>
                <li class="item">
                    <i class="fa-solid fa-book-bookmark"></i> Resource
                </li>
                <li class="item">
                    <i class="fa-solid fa-circle-question"></i> Help
                </li>
                <li class="item">
                    <i class="fa-solid fa-gears"></i> Settings
                </li>
            </ul>
        </menu>

        <div class="right-section">
            <header class="header">
                <h1 class="text">Dashboard</h1>
                <div class="search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Search">
                </div>
            </header>

            <div class="welcome">
                <p class="name">Welcome, Name...!</p>
                <p class="description">You have 2 assignments due today.</p>
            </div>

            <div class="status-box">
                <p class="student">Student Status</p>

                <div class="status">
                    <div class="attendance">
                        <div class="logo">
                            <i class="fa-solid fa-user-check"></i>
                        </div>
                        <div>
                            <p>95%</p>
                            <p>Attendance</p>
                        </div>
                    </div>
                    <div class="attendance">
                        <div class="logo">
                            <i class="fa-solid fa-chart-line"></i>
                        </div>
                        <div>
                            <p>91%</p>
                            <p>Avg Progress</p>
                        </div>
                    </div>
                    <div class="attendance">
                        <div class="logo">
                            <i class="fa-solid fa-list-check"></i>
                        </div>
                        <div>
                            <p>4/5</p>
                            <p>Task Done</p>
                        </div>
                    </div>
                </div>
                
            </div>


        </div>

        

    </div>
</body>
</html>
